name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: speed-math-warrior-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
